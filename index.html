    <!-- Schema.org JSON-LD Structured Data for Match Sharing -->
    <script type="application/ld+json" id="match-ld-json">
    {
      "@context": "https://schema.org",
      "@type": "SportsEvent",
      "name": "كورة لايف - بث المباريات مباشرة و يومياً",
      "description": "منصة بث المباريات المباشرة ومواعيد ونتائج مباريات اليوم والقنوات الناقلة والتعليق العربي وترتيب الدوريات.",
      "sport": "Soccer",
      "eventStatus": "https://schema.org/EventLive"
    }
    </script>

    <!-- Automatic Current Match Data Injection for Social Media Sharing & Dynamic Previews -->
    <script>
      (function() {
        try {
          // Read match ID from query string '?match=...' or hash '#match=...'
          var params = new URLSearchParams(window.location.search);
          var matchId = params.get('match');
          if (!matchId && window.location.hash && window.location.hash.indexOf('match=') !== -1) {
            var hashMatch = window.location.hash.split('match=')[1];
            if (hashMatch) matchId = hashMatch.split('&')[0];
          }

          var targetMatch = null;
          var cachedRaw = localStorage.getItem('kora_live_matches_v2');
          if (cachedRaw) {
            try {
              var matchesList = JSON.parse(cachedRaw);
              if (Array.isArray(matchesList) && matchesList.length > 0) {
                if (matchId) {
                  targetMatch = matchesList.find(function(m) { return m.id === matchId; });
                }
                if (!targetMatch) {
                  // If no specific match requested, pick the current top live match
                  targetMatch = matchesList.find(function(m) { return m.status === 'live'; }) || matchesList[0];
                }
              }
            } catch(e) {}
          }

          // Fallback default showcase match if localStorage is empty
          if (!targetMatch) {
            targetMatch = {
              id: matchId || 'match-today-1',
              leagueName: 'دوري أبطال أوروبا',
              channel: 'beIN Sports 1 HD Premium',
              commentator: 'عصام الشوالي',
              status: 'live',
              homeScore: 2,
              awayScore: 1,
              currentMinute: 72,
              homeTeam: { name: 'ريال مدريد', logo: 'https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=1200&h=630&fit=crop&q=80' },
              awayTeam: { name: 'مانشستر سيتي', logo: 'https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=1200&h=630&fit=crop&q=80' }
            };
          }

          if (targetMatch && targetMatch.homeTeam && targetMatch.awayTeam) {
            var home = targetMatch.homeTeam.name || 'الفريق المضيف';
            var away = targetMatch.awayTeam.name || 'الفريق الضيف';
            var league = targetMatch.leagueName || 'أقوى المباريات';
            var isLive = targetMatch.status === 'live';
            var isFinished = targetMatch.status === 'finished';

            var scoreText = isLive
              ? ('مباشر الآن (' + (targetMatch.homeScore || 0) + ' - ' + (targetMatch.awayScore || 0) + ') دقيقة ' + (targetMatch.currentMinute || 0) + "'")
              : (isFinished
                ? ('انتهت (' + (targetMatch.homeScore || 0) + ' - ' + (targetMatch.awayScore || 0) + ')')
                : ('الساعة ' + (targetMatch.time || '22:00') + ' بتوقيت مكة'));

            var dynamicTitle = '🔴 بث مباشر: ' + home + ' ضد ' + away + ' | ' + league + ' - كورة لايف';
            var dynamicDesc = 'شاهد الآن البث المباشر لمباراة ' + home + ' و ' + away + ' (' + scoreText + ') في ' + league + '. القناة: ' + (targetMatch.channel || 'beIN Sports') + ' • تعليق: ' + (targetMatch.commentator || 'عصام الشوالي') + ' • سيرفرات سريعة بدون تقطيع.';
            var shareUrl = window.location.origin + window.location.pathname + '?match=' + encodeURIComponent(targetMatch.id);
            var matchImage = (targetMatch.homeTeam && targetMatch.homeTeam.logo) || (targetMatch.awayTeam && targetMatch.awayTeam.logo) || 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=1200&h=630&fit=crop&q=80';

            // Only override if specific match ID was requested or on initial load
            if (matchId) {
              document.title = dynamicTitle;
            }

            function setAttr(sel, attr, val) {
              var el = document.querySelector(sel);
              if (el) el.setAttribute(attr, val);
            }

            setAttr('meta[name="description"]', 'content', dynamicDesc);
            setAttr('meta[property="og:title"]', 'content', dynamicTitle);
            setAttr('meta[property="og:description"]', 'content', dynamicDesc);
            setAttr('meta[property="og:url"]', 'content', shareUrl);
            setAttr('meta[property="og:image"]', 'content', matchImage);
            setAttr('meta[property="og:image:secure_url"]', 'content', matchImage);
            setAttr('meta[property="og:image:alt"]', 'content', home + ' ضد ' + away + ' - بث مباشر');
            setAttr('meta[name="twitter:title"]', 'content', dynamicTitle);
            setAttr('meta[name="twitter:description"]', 'content', dynamicDesc);
            setAttr('meta[name="twitter:image"]', 'content', matchImage);
            setAttr('meta[name="twitter:image:alt"]', 'content', home + ' ضد ' + away);
            setAttr('meta[name="twitter:data1"]', 'content', league);
            setAttr('meta[name="twitter:data2"]', 'content', isLive ? 'مباشر الآن 🔴' : (targetMatch.time || 'قريباً'));

            var ldJson = document.getElementById('match-ld-json');
            if (ldJson) {
              ldJson.textContent = JSON.stringify({
                '@context': 'https://schema.org',
                '@type': 'SportsEvent',
                'name': home + ' ضد ' + away,
                'description': dynamicDesc,
                'sport': 'Soccer',
                'url': shareUrl,
                'eventStatus': isLive ? 'https://schema.org/EventLive' : (isFinished ? 'https://schema.org/EventCompleted' : 'https://schema.org/EventScheduled'),
                'homeTeam': { '@type': 'SportsTeam', 'name': home, 'image': targetMatch.homeTeam.logo },
                'awayTeam': { '@type': 'SportsTeam', 'name': away, 'image': targetMatch.awayTeam.logo }
              });
            }
          }
        } catch(err) {
          console.warn('Match meta injection:', err);
        }
      })();
    </script>

    <script>

          loader.innerHTML = '<div style="background:#0f172a;border:2px solid #10b981;border-radius:24px;padding:28px;max-width:500px;margin:20px auto;box-shadow:0 25px 50px rgba(0,0,0,0.6);text-align:right;direction:rtl;">' +
            '<div style="text-align:center;margin-bottom:14px;">' +

            '</div>' +

            '<p style="color:#cbd5e1;font-size:13px;line-height:1.7;margin:0 0 14px;">' +

            '</p>' +
            '<div style="background:#020617;border:1px solid #1e293b;border-radius:14px;padding:14px;margin-bottom:16px;font-size:12px;color:#94a3b8;line-height:1.8;">' +
              '1️⃣ ادخل إلى مستودعك على <b>GitHub</b> ثم اضغط <b>Settings</b><br>' +

            '</div>' +
            '<button onclick="location.reload();" style="width:100%;background:#10b981;color:#020617;font-weight:900;border:none;padding:12px;border-radius:12px;cursor:pointer;font-size:13px;">تحديث الصفحة الآن 🔄</button>' +
          '</div>';

    <script>
      // Fallback in case main bundle fails to execute or network timed out
      setTimeout(function() {
        var loader = document.getElementById('loading-fallback');
        if (loader && loader.parentElement && !window.__REACT_LOADED__) {
          loader.innerHTML = '<div style="background:#0f172a;border:1px solid #334155;border-radius:20px;padding:28px;max-width:480px;box-shadow:0 20px 40px rgba(0,0,0,0.5);">' +
